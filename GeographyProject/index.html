<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Terra — Interactive Geography & Earth Explorer</title>
<style>
/* ============================== THEME TOKENS ============================== */
:root{
  --bg:#070b14; --bg-soft:#0b1120; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.16);
  --text:#e9effc; --muted:#8fa1c0; --dim:#64748b;
  --accent:#4ea8ff; --accent-2:#41e0b0; --hot:#ff7a59; --warn:#ffc24b; --violet:#a78bfa;
  --shadow:0 18px 50px -20px rgba(0,0,0,.85);
  --r:16px; --r-sm:10px;
  --grad:linear-gradient(135deg,#4ea8ff 0%,#41e0b0 100%);
}
[data-theme="light"]{
  --bg:#eef3fb; --bg-soft:#ffffff; --panel:rgba(12,34,66,.04); --panel-2:rgba(12,34,66,.07);
  --border:rgba(12,34,66,.13); --border-2:rgba(12,34,66,.22);
  --text:#0c1a2e; --muted:#5a6c88; --dim:#7b8aa3;
  --accent:#1b74e4; --accent-2:#0a9c73; --hot:#e2542c; --warn:#c98600; --violet:#7c5cf0;
  --shadow:0 18px 40px -24px rgba(12,34,66,.35);
  --grad:linear-gradient(135deg,#1b74e4 0%,#0a9c73 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 620px at 78% -10%, rgba(78,168,255,.16), transparent 60%),
    radial-gradient(900px 560px at 8% 105%, rgba(65,224,176,.11), transparent 60%);
}
[data-theme="light"] body::before{
  background:
    radial-gradient(1100px 620px at 78% -10%, rgba(27,116,228,.10), transparent 60%),
    radial-gradient(900px 560px at 8% 105%, rgba(10,156,115,.09), transparent 60%);
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================== LAYOUT ============================== */
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{
  width:250px;flex:none;position:fixed;top:0;bottom:0;left:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(18px);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;gap:6px;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 18px}
.brand .mark{
  width:34px;height:34px;border-radius:11px;background:var(--grad);
  display:grid;place-items:center;font-size:17px;box-shadow:0 8px 22px -10px var(--accent);
}
.brand h1{font-size:16px;font-weight:750;letter-spacing:-.3px}
.brand span{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.navlink{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  color:var(--muted);font-size:14px;font-weight:550;transition:.18s;cursor:pointer;width:100%;text-align:left;
}
.navlink:hover{background:var(--panel);color:var(--text)}
.navlink.active{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.navlink.active .ico{filter:none;opacity:1}
.navlink .ico{font-size:16px;width:20px;text-align:center;opacity:.85}
.sidebar-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
.content{margin-left:250px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 26px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
}
.searchbox{
  flex:1;max-width:520px;display:flex;align-items:center;gap:9px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:9px 13px;transition:.2s;
}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.searchbox input{flex:1;background:none;border:none;outline:none;font-size:13.5px}
.searchbox input::placeholder{color:var(--dim)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--border);transition:.18s;font-size:15px;
}
.iconbtn:hover{background:var(--panel-2);transform:translateY(-1px)}
main#view{padding:26px;max-width:1500px;width:100%;margin:0 auto;flex:1}
.bottomnav{display:none}

/* ============================== PRIMITIVES ============================== */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;transition:.22s;position:relative;overflow:hidden;
}
.card.hoverable:hover{transform:translateY(-3px);border-color:var(--border-2);background:var(--panel-2);box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:680;letter-spacing:-.2px}
.card p{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:600;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
}
.chip.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip.green{color:var(--accent-2);border-color:color-mix(in srgb,var(--accent-2) 40%,transparent);background:color-mix(in srgb,var(--accent-2) 12%,transparent)}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;
  font-size:13.5px;font-weight:620;border:1px solid var(--border);background:var(--panel);transition:.18s;
}
.btn:hover{background:var(--panel-2);transform:translateY(-1px)}
.btn.primary{background:var(--grad);color:#04121f;border-color:transparent;box-shadow:0 10px 26px -14px var(--accent)}
[data-theme="light"] .btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.section-head{display:flex;align-items:flex-end;gap:14px;margin:34px 0 14px;flex-wrap:wrap}
.section-head h2{font-size:21px;font-weight:750;letter-spacing:-.5px}
.section-head p{font-size:13px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.crumbs{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumbs button{color:var(--muted);font-size:12px}
.crumbs button:hover{color:var(--accent)}
.divider{height:1px;background:var(--border);margin:22px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.bar{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bullets{list-style:none;display:grid;gap:8px}
.bullets li{position:relative;padding-left:18px;font-size:13.5px;color:var(--muted)}
.bullets li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:99px;background:var(--accent)}

/* ============================== HERO ============================== */
.hero{
  position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--border);
  background:linear-gradient(150deg,color-mix(in srgb,var(--bg-soft) 92%,transparent),color-mix(in srgb,var(--bg) 70%,transparent));
  display:grid;grid-template-columns:1.05fr .95fr;min-height:440px;
}
.hero-copy{padding:44px 40px;display:flex;flex-direction:column;justify-content:center;gap:16px;z-index:2}
.hero h2{font-size:clamp(30px,4.2vw,50px);line-height:1.05;font-weight:800;letter-spacing:-1.6px}
.hero h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:15.5px;color:var(--muted);max-width:52ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero-globe{position:relative;min-height:400px}
.globe-wrap{position:absolute;inset:0}
.globe-canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.globe-canvas:active{cursor:grabbing}
.globe-hint{
  position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--muted);
  background:color-mix(in srgb,var(--bg) 72%,transparent);padding:5px 10px;border-radius:99px;border:1px solid var(--border);
  backdrop-filter:blur(8px);pointer-events:none;
}
.css-globe{
  position:absolute;inset:12%;border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%, #6fc3ff 0%, #1b74e4 34%, #0b2a4a 68%, #04101f 100%);
  box-shadow:inset -22px -18px 60px rgba(0,0,0,.75),0 0 90px -10px rgba(78,168,255,.5);
  animation:spinpulse 12s ease-in-out infinite;
}
.css-globe::after{
  content:"";position:absolute;inset:-8%;border-radius:50%;
  background:radial-gradient(circle,rgba(78,168,255,.28),transparent 62%);
}
@keyframes spinpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* ============================== GLOBE VIEW ============================== */
.globe-stage{
  position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);
  background:radial-gradient(circle at 50% 45%,#0a1626,#03060d 72%);min-height:520px;height:min(72vh,720px);
}
[data-theme="light"] .globe-stage{background:radial-gradient(circle at 50% 45%,#dce9f9,#b9cde6 72%)}
.layerbar{
  position:absolute;top:14px;left:14px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 28px);
}
.layerbtn{
  padding:7px 12px;border-radius:99px;font-size:11.5px;font-weight:620;
  background:color-mix(in srgb,#000 42%,transparent);border:1px solid var(--border);
  color:#cfe0f5;backdrop-filter:blur(10px);transition:.18s;
}
.layerbtn:hover{background:color-mix(in srgb,#000 25%,transparent)}
.layerbtn.active{background:var(--grad);color:#04121f;border-color:transparent}
[data-theme="light"] .layerbtn{background:rgba(255,255,255,.82);color:#123;border-color:var(--border)}
[data-theme="light"] .layerbtn.active{color:#fff}
.globe-info{
  position:absolute;right:14px;bottom:14px;z-index:5;width:min(320px,calc(100% - 28px));
  background:color-mix(in srgb,var(--bg) 86%,transparent);border:1px solid var(--border);
  border-radius:14px;padding:14px;backdrop-filter:blur(14px);
}
.globe-info h4{font-size:13.5px;margin-bottom:4px}
.globe-info p{font-size:12px;color:var(--muted)}

/* ============================== TIMELINE ============================== */
.tl-track{
  position:relative;display:flex;height:56px;border-radius:14px;overflow:hidden;border:1px solid var(--border);
}
.tl-seg{position:relative;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
  color:#04121f;letter-spacing:.4px;cursor:pointer;transition:.2s;overflow:hidden;white-space:nowrap}
.tl-seg:hover{filter:brightness(1.14)}
.tl-seg.active{box-shadow:inset 0 0 0 3px var(--text)}
.tl-slider{width:100%;margin:18px 0 4px;accent-color:var(--accent);height:26px}
.tl-marks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}

/* ============================== MISC BLOCKS ============================== */
.whyflow{display:grid;gap:0}
.why-step{
  display:flex;gap:12px;align-items:flex-start;padding:11px 0;
}
.why-step .dot{
  width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:750;
  background:var(--panel-2);border:1px solid var(--border);color:var(--accent);
}
.why-step:not(:last-child) .dot::after{content:"";position:absolute}
.why-arrow{margin-left:12px;color:var(--dim);font-size:13px;line-height:1}
.why-step p{font-size:13.5px;color:var(--text)}
.topic-card{cursor:pointer}
.topic-card .ic{font-size:20px;margin-bottom:10px;display:block}
.ref-item{padding:11px 0;border-bottom:1px solid var(--border);display:flex;gap:12px}
.ref-item:last-child{border-bottom:none}
.ref-item .tag{flex:none;font-size:9.5px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;padding:3px 7px;border-radius:6px;height:fit-content}
.tag.primary{background:color-mix(in srgb,var(--accent-2) 18%,transparent);color:var(--accent-2)}
.tag.secondary{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.ref-item a{font-size:13px;font-weight:600;color:var(--accent)}
.ref-item a:hover{text-decoration:underline}
.ref-item .meta{font-size:11.5px;color:var(--muted)}
.quiz-opt{
  display:block;width:100%;text-align:left;padding:12px 15px;border-radius:12px;
  border:1px solid var(--border);background:var(--panel);margin-bottom:9px;font-size:13.5px;transition:.18s;
}
.quiz-opt:hover{border-color:var(--accent);background:var(--panel-2)}
.quiz-opt.correct{border-color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 15%,transparent)}
.quiz-opt.wrong{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 15%,transparent)}
.quiz-opt:disabled{cursor:default}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{font-weight:560}
.flagbig{font-size:44px;line-height:1}
.stat{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--border)}
.stat b{font-size:19px;font-weight:750;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
canvas.viz{width:100%;display:block;border-radius:14px;background:var(--bg-soft);border:1px solid var(--border)}
.seg-ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg-ctrl button{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--panel);transition:.18s}
.seg-ctrl button.active{background:var(--grad);color:#04121f;border-color:transparent}
[data-theme="light"] .seg-ctrl button.active{color:#fff}
.search-result{display:flex;gap:13px;align-items:center;padding:13px;border-radius:13px;border:1px solid var(--border);background:var(--panel);cursor:pointer;transition:.18s}
.search-result:hover{background:var(--panel-2);transform:translateX(3px)}
.search-result .r-ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--panel-2);font-size:17px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);z-index:100;
  background:var(--panel-2);border:1px solid var(--border-2);backdrop-filter:blur(14px);
  padding:11px 18px;border-radius:12px;font-size:13px;transition:transform .35s cubic-bezier(.2,.9,.2,1)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ============================== RESPONSIVE ============================== */
@media(max-width:1080px){
  .hero{grid-template-columns:1fr}
  .hero-globe{min-height:330px;order:-1}
  .hero-copy{padding:30px 26px 36px}
}
@media(max-width:900px){
  .sidebar{display:none}
  .content{margin-left:0;padding-bottom:78px}
  main#view{padding:18px}
  .topbar{padding:10px 16px}
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);
    border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;
  }
  .bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--muted);font-weight:600;padding:5px 8px;border-radius:10px;flex:1}
  .bottomnav button.active{color:var(--accent)}
  .bottomnav button .ico{font-size:17px}
  .globe-stage{height:58vh;min-height:380px}
  .globe-info{position:static;width:auto;margin-top:10px}
}
@media(max-width:560px){
  .topbar-actions .lbl{display:none}
  .hero h2{letter-spacing:-1px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">🌍</div>
      <div><h1>Terra</h1><span>Earth Explorer</span></div>
    </div>
    <nav id="sidenav"></nav>
    <div class="sidebar-foot">
      Prototype build · Educational content with cited sources. Figures are dated estimates.
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <label class="searchbox">
        <span aria-hidden="true">🔍</span>
        <input id="globalSearch" type="search" placeholder="Search countries, mountains, rivers, concepts…" aria-label="Global search" autocomplete="off"/>
      </label>
      <div class="topbar-actions">
        <button class="iconbtn" id="themeToggle" title="Toggle light / dark mode" aria-label="Toggle theme">🌙</button>
        <button class="iconbtn" data-nav="bookmarks" title="Bookmarks" aria-label="Bookmarks">🔖</button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="bottomnav" id="bottomnav"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
"use strict";
/* ==========================================================================
   0. UTILITIES
   ========================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const nf = n => n == null ? "—" : n.toLocaleString("en-US");
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function maToLabel(ma){
  if (ma >= 1000) return (ma/1000).toFixed(ma % 1000 === 0 ? 0 : 2) + " Ga";
  return ma + " Ma";
}
function maToYears(ma){
  if (ma >= 1000) return (ma/1000).toFixed(2) + " billion years ago";
  if (ma >= 1) return ma + " million years ago";
  return (ma*1000).toFixed(0) + ",000 years ago";
}

/* ==========================================================================
   1. STATE  (persisted)
   ========================================================================== */
const store = {
  key: "terra.geo.v1",
  data: { theme:"dark", completed:{}, bookmarks:{}, recent:[], quizBest:0 },
  load(){
    try { const raw = localStorage.getItem(this.key); if (raw) Object.assign(this.data, JSON.parse(raw)); }
    catch(e){ /* storage unavailable — run in memory */ }
    return this.data;
  },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e){} }
};
store.load();

function markComplete(id, on = true){
  if (on) store.data.completed[id] = true; else delete store.data.completed[id];
  store.save();
}
function toggleBookmark(id){
  if (store.data.bookmarks[id]) delete store.data.bookmarks[id];
  else store.data.bookmarks[id] = true;
  store.save();
  return !!store.data.bookmarks[id];
}
function pushRecent(id){
  const r = store.data.recent.filter(x => x !== id);
  r.unshift(id); store.data.recent = r.slice(0, 12); store.save();
}

/* ==========================================================================
   2. REFERENCES  (real organisations; links go to their official sections)
   ========================================================================== */
const REFS = {
  usgsTectonics:{ t:"Plate Tectonics", o:"U.S. Geological Survey (USGS)", u:"https://www.usgs.gov/programs/earthquake-hazards/plate-tectonics", type:"primary" },

  function latLonToVec3(lat, lon, r){
    const phi = (90 - lat) * Math.PI/180;
    const theta = (lon + 180) * Math.PI/180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
       r * Math.cos(phi),
       r * Math.sin(phi) * Math.sin(theta)
    );
  }

  function buildTexture(theme){
    const W = 2048, H = 1024;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    const dark = theme !== "light";

    // Ocean
    const og = ctx.createLinearGradient(0,0,0,H);
    if (dark){ og.addColorStop(0,"#0a2740"); og.addColorStop(.5,"#0d3a5c"); og.addColorStop(1,"#0a2740"); }
    else { og.addColorStop(0,"#9dc4e8"); og.addColorStop(.5,"#7fb0dd"); og.addColorStop(1,"#9dc4e8"); }
    ctx.fillStyle = og; ctx.fillRect(0,0,W,H);

    // Graticule
    ctx.strokeStyle = dark ? "rgba(140,200,255,.10)" : "rgba(20,60,110,.14)";
    ctx.lineWidth = 1.2;
    for (let lon=-180; lon<=180; lon+=30){
      const x = (lon+180)/360*W;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for (let lat=-60; lat<=60; lat+=30){
      const y = (90-lat)/180*H;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    // Equator emphasis
    ctx.strokeStyle = dark ? "rgba(120,190,255,.18)" : "rgba(20,60,110,.22)";
    ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();

    // Land
    const toXY = p => [ (p[0]+180)/360*W, (90-p[1])/180*H ];
    ctx.fillStyle = dark ? "#1f5a44" : "#4f9e73";
    ctx.strokeStyle = dark ? "#3fae86" : "#2c7a55";
    ctx.lineWidth = 2;
    for (const poly of LAND_POLYGONS){
      ctx.beginPath();
      poly.forEach((p,i) => { const [x,y] = toXY(p); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    // Antarctica white
    ctx.fillStyle = dark ? "#dfeaf5" : "#f4f9ff";
    ctx.beginPath();
    [[-180,-70],[-160,-73],[-140,-75],[-120,-73],[-100,-74],[-80,-70],[-60,-63],[-40,-70],[-20,-70],[0,-70],[20,-68],[40,-67],[60,-67],[80,-67],[100,-66],[120,-66],[140,-66],[160,-70],[180,-70],[180,-90],[-180,-90]]

    [[-45,60],[-20,70],[-20,76],[-30,83],[-55,83],[-60,76],[-55,66]]

    ctx.fillStyle = sg; ctx.fillRect(0,H*0.90,W,H*0.10);

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    return tex;

        const s = 0.006 + Math.min(0.020, (c.pop / 1.5e9) * 0.030);
        add(c.lat, c.lon, 0xffc24b, s, { title:c.n, sub:`≈ ${(c.pop/1e6).toFixed(0)} million (${c.popYear} est.)`, nav:"country", param:c.n });
      });
    }
    else if (layer === "disasters"){
      [["Ring of Fire (Pacific belt)",35,142],["San Andreas Fault",36,-120],["North Anatolian Fault",40,36],
       ["Himalayan seismic belt",28,85],["East African Rift",-3,36],["Mid-Atlantic Ridge",0,-25],
       ["Atlantic hurricane belt",20,-60],["Tornado Alley",35,-98],["Indian Ocean tsunami zone",5,95]]
        .forEach(([n,la,lo]) => add(la, lo, 0xff7a59, 0.011, { title:n, sub:"Hazard zone (indicative)", nav:"topic", param:"earthquakes" }));
    }
  }

  function init(){
    if (inited || typeof THREE === "undefined") return;
    inited = true;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(0, 0, 3.1);

    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.domElement.className = "globe-canvas";
    renderer.domElement.setAttribute("aria-label","Interactive 3D Earth globe");
    renderer.domElement.setAttribute("role","img");

    root = new THREE.Group(); scene.add(root);

    const tex = buildTexture(document.documentElement.dataset.theme);
    earthMesh = new THREE.Mesh(
      new THREE.SphereGeometry(1, 72, 48),
      new THREE.MeshPhongMaterial({ map: tex, shininess: 8, specular: new THREE.Color(0x113355) })
    );
    root.add(earthMesh);

    // Atmosphere
    const atmoMat = new THREE.ShaderMaterial({
      transparent:true, side: THREE.BackSide, depthWrite:false,
      uniforms:{ c:{ value:new THREE.Color(0x4ea8ff) } },
      vertexShader:`varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader:`uniform vec3 c; varying vec3 vN; void main(){ float i = pow(0.72 - dot(vN, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(c, 1.0) * i; }`
    });
    root.add(new THREE.Mesh(new THREE.SphereGeometry(1.16, 48, 32), atmoMat));

    markerGroup = new THREE.Group(); root.add(markerGroup);
    lineGroup   = new THREE.Group(); root.add(lineGroup);

    // Stars
    const starGeo = new THREE.BufferGeometry();
    const pos = new Float32Array(1400 * 3);
    for (let i=0;i<1400;i++){
      const r = 40 + Math.random()*60;
      const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
      pos[i*3]   = r*Math.sin(p)*Math.cos(t);
      pos[i*3+1] = r*Math.cos(p);
      pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
    stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.35, transparent:true, opacity:0.7, sizeAttenuation:true }));
    scene.add(stars);

    scene.add(new THREE.AmbientLight(0xffffff, 0.62));
    const sun = new THREE.DirectionalLight(0xffffff, 1.15);
    sun.position.set(4, 2, 3); scene.add(sun);
    const rim = new THREE.DirectionalLight(0x4ea8ff, 0.42);
    rim.position.set(-4, -1, -3); scene.add(rim);

    raycaster = new THREE.Raycaster();
    pointer = new THREE.Vector2();

    buildMarkers();
    attachInput();
  }

  function attachInput(){
    const el = renderer.domElement;
    el.addEventListener("pointerdown", e => {
      drag = true; lastX = e.clientX; lastY = e.clientY;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", e => {
      if (!drag) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      rotY += dx * 0.005;
      rotX = clamp(rotX + dy * 0.004, -1.15, 1.15);
      velX = dx * 0.005; velY = dy * 0.004;
    });
    el.addEventListener("pointerup", e => {
      drag = false;
      if (Math.abs(velX) < 0.002 && Math.abs(velY) < 0.002) pick(e);
      velX = 0; velY = 0;
    });
    el.addEventListener("wheel", e => {
      e.preventDefault();
      camera.position.z = clamp(camera.position.z + e.deltaY * 0.0016, 1.45, 6.5);
    }, { passive:false });
  }

  function pick(e){
    if (!container) return;
    const r = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(markers, false);
    if (hits.length && onSelect) onSelect(hits[0].object.userData);
  }

  function resize(){
    if (!renderer || !container) return;
    const w = container.clientWidth || 600, h = container.clientHeight || 400;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function loop(){
    raf = requestAnimationFrame(loop);
    if (!drag){
      rotY += velX; rotX = clamp(rotX + velY, -1.15, 1.15);
      velX *= 0.94; velY *= 0.90;
      if (autoRotate) rotY += 0.0012;
    }
    root.rotation.y = rotY;
    root.rotation.x = rotX;
    if (stars) stars.rotation.y += 0.00012;
    renderer.render(scene, camera);
  }

  return {
    get available(){ return typeof THREE !== "undefined"; },
    mount(el, opts = {}){
      if (!this.available){ el.innerHTML = '<div class="css-globe"></div><div class="globe-hint">WebGL unavailable — showing static globe</div>'; return; }
      init();
      container = el;
      el.appendChild(renderer.domElement);
      onSelect = opts.onSelect || null;
      mounted = true;
      resize();
      if (!raf) loop();
      if (window.ResizeObserver){
        if (this._ro) this._ro.disconnect();
        this._ro = new ResizeObserver(resize);
        this._ro.observe(el);
      }
    },
    unmount(){
      mounted = false;
      if (raf){ cancelAnimationFrame(raf); raf = null; }
      if (this._ro){ this._ro.disconnect(); this._ro = null; }
      if (renderer && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
      container = null;
    },
    setLayer(l){ layer = l; if (inited) buildMarkers(); },
    getLayer(){ return layer; },
    setTheme(theme){
      if (!inited || !earthMesh) return;
      earthMesh.material.map.dispose();
      earthMesh.material.map = buildTexture(theme);
      earthMesh.material.needsUpdate = true;
    },
    focus(lat, lon){
      rotY = -(lon + 180) * Math.PI/180 + Math.PI;
      rotX = clamp(lat * Math.PI/180, -1.15, 1.15);
      camera.position.z = clamp(2.0, 1.45, 6.5);
    },
    setAutoRotate(v){ autoRotate = v; }
  };
})();

   9. VISUALISATIONS (canvas 2D)
   ========================================================================== */
let vizLoops = [];
function stopViz(){ vizLoops.forEach(id => cancelAnimationFrame(id)); vizLoops = []; }
function vizLoop(fn){ const id = requestAnimationFrame(t => { fn(t); }); vizLoops.push(id); }

function TectonicsViz(canvas){
  const ctx = canvas.getContext("2d");
  let mode = "convergent", t = 0;
  const dpr = Math.min(devicePixelRatio || 1, 2);

  function size(){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * dpr; canvas.height = 300 * dpr;
    canvas.style.height = "300px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return { w: r.width, h: 300 };
  }
  let dim = size();
  new ResizeObserver(() => { dim = size(); }).observe(canvas);

  const styles = getComputedStyle(document.documentElement);
  function col(name, fallback){ return styles.getPropertyValue(name).trim() || fallback; }

  function draw(){
    t += 1;
    const { w, h } = dim;
    const dark = document.documentElement.dataset.theme !== "light";
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = dark ? "#070e1a" : "#f0f5fc";
    ctx.fillRect(0,0,w,h);

    // mantle
    const mg = ctx.createLinearGradient(0, h*0.55, 0, h);
    mg.addColorStop(0, dark ? "#2a1408" : "#f6d8bd");
    mg.addColorStop(1, dark ? "#5c2a10" : "#e0ab7c");
    ctx.fillStyle = mg; ctx.fillRect(0, h*0.58, w, h*0.42);

    const cycle = (t % 300) / 300;
    const off = Math.sin(cycle * Math.PI * 2) * 14;

    function plate(x, y, pw, ph, color, label){
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, pw, ph, 7);
      ctx.fill();
      ctx.strokeStyle = dark ? "rgba(255,255,255,.22)" : "rgba(0,0,0,.18)";
      ctx.stroke();
      ctx.fillStyle = dark ? "#e9effc" : "#0c1a2e";
      ctx.font = "600 12px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(label, x + pw/2, y + ph/2 + 4);
    }

    const top = h*0.30, ph = h*0.26;
    ctx.textAlign = "center";
    ctx.fillStyle = dark ? "#8fa1c0" : "#5a6c88";
    ctx.font = "600 12px ui-sans-serif, system-ui";
    ctx.fillText("LITHOSPHERE (plates)", w/2, top - 14);

    if (mode === "convergent"){
      plate(w*0.06 - off, top, w*0.40, ph, dark ? "#2f5d8a" : "#8fb8dd", "Oceanic plate");
      plate(w*0.54 + off, top, w*0.40, ph, dark ? "#2f7a5e" : "#9ad3b4", "Continental plate");
      // subduction wedge
      ctx.fillStyle = dark ? "#2f5d8a" : "#8fb8dd";
      ctx.beginPath();
      ctx.moveTo(w*0.46 - off, top + ph);
      ctx.lineTo(w*0.60 + off, top + ph + 70);
      ctx.lineTo(w*0.50 - off, top + ph + 12);
      ctx.closePath(); ctx.fill();
      // mountains
      ctx.fillStyle = dark ? "#41e0b0" : "#0a9c73";
      ctx.beginPath();
      ctx.moveTo(w*0.56 + off, top);
      ctx.lineTo(w*0.66 + off, top - 46);
      ctx.lineTo(w*0.76 + off, top);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = dark ? "#e9effc" : "#0c1a2e";
      ctx.font = "600 11px ui-sans-serif";
      ctx.fillText("Mountain belt", w*0.66 + off, top - 56);
      ctx.fillText("Trench", w*0.48 - off, top + ph + 88);
    } else if (mode === "divergent"){
      plate(w*0.06 - off, top, w*0.42, ph, dark ? "#2f7a5e" : "#9ad3b4", "Plate A");
      plate(w*0.52 + off, top, w*0.42, ph, dark ? "#2f7a5e" : "#9ad3b4", "Plate B");
      // ridge / magma
      const cx = w/2;
      const rg = ctx.createLinearGradient(cx, top+ph, cx, h);
      rg.addColorStop(0, "rgba(255,122,89,.95)");
      rg.addColorStop(1, "rgba(255,122,89,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(cx - 26, top + ph + 40);
      ctx.lineTo(cx + 26, top + ph + 40);
      ctx.lineTo(cx + 8, top + ph - 4);
      ctx.lineTo(cx - 8, top + ph - 4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = dark ? "#e9effc" : "#0c1a2e";
      ctx.font = "600 11px ui-sans-serif";
      ctx.fillText("Mid-ocean ridge", cx, top - 18);
      ctx.fillText("Magma rises", cx, top + ph + 58);
    } else {
      plate(w*0.04 - off, top, w*0.46, ph, dark ? "#5b4a8a" : "#bcaee6", "Plate A");
      plate(w*0.50 + off, top, w*0.46, ph, dark ? "#8a6a3a" : "#e6cfae", "Plate B");
      ctx.strokeStyle = "#ff7a59"; ctx.lineWidth = 2.5; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.moveTo(w/2, top - 26); ctx.lineTo(w/2, top + ph + 8); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = dark ? "#e9effc" : "#0c1a2e";
      ctx.font = "600 11px ui-sans-serif";
      ctx.fillText("Transform fault — plates slide past", w/2, top - 36);
    }

    // arrows
    ctx.strokeStyle = dark ? "#4ea8ff" : "#1b74e4";
    ctx.lineWidth = 2.5;
    function arrow(x1,y1,x2,y2){
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const a = Math.atan2(y2-y1, x2-x1);
      ctx.beginPath();
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2 - 9*Math.cos(a-0.4), y2 - 9*Math.sin(a-0.4));
      ctx.lineTo(x2 - 9*Math.cos(a+0.4), y2 - 9*Math.sin(a+0.4));
      ctx.closePath(); ctx.fillStyle = dark ? "#4ea8ff" : "#1b74e4"; ctx.fill();
    }
    if (mode === "convergent"){
      arrow(w*0.10, top+ph+18, w*0.26, top+ph+18);
      arrow(w*0.90, top+ph+18, w*0.74, top+ph+18);
    } else if (mode === "divergent"){
      arrow(w*0.30, top-24, w*0.14, top-24);
      arrow(w*0.70, top-24, w*0.86, top-24);
    } else {
      arrow(w*0.20, top+ph+22, w*0.40, top+ph+22);
      arrow(w*0.80, top+ph+22, w*0.60, top+ph+22);
    }

    ctx.fillStyle = dark ? "#8fa1c0" : "#5a6c88";
    ctx.font = "11px ui-sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(mode === "convergent" ? "Convergent: crust is destroyed (subduction) and mountains rise"
              : mode === "divergent" ? "Divergent: new crust is created at the ridge"
              : "Transform: crust is neither created nor destroyed", w/2, h - 12);

    vizLoop(draw);
  }
  const api = {
    setMode(m){ mode = m; },
    start(){ vizLoop(draw); },
    stop(){ stopViz(); }
  };
  return api;
}

function WaterCycleViz(canvas){
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let dim = { w: 600, h: 320 }, t = 0, parts = [];
  function size(){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width*dpr; canvas.height = 320*dpr; canvas.style.height = "320px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dim = { w: r.width, h: 320 };
  }
  size();
  new ResizeObserver(size).observe(canvas);

  for (let i=0;i<70;i++) parts.push({ x: Math.random(), y: Math.random(), s: 0.3 + Math.random()*0.7, p: Math.random()*Math.PI*2 });

  function draw(){
    t += 1;
    const { w, h } = dim;
    const dark = document.documentElement.dataset.theme !== "light";
    ctx.clearRect(0,0,w,h);

    // sky
    const sg = ctx.createLinearGradient(0,0,0,h*0.72);
    sg.addColorStop(0, dark ? "#0a1a2e" : "#cfe4fa");
    sg.addColorStop(1, dark ? "#123049" : "#e9f3ff");
    ctx.fillStyle = sg; ctx.fillRect(0,0,w,h*0.72);

    // sun
    ctx.beginPath();
    ctx.arc(w*0.12, h*0.16, 26, 0, Math.PI*2);
    const sunG = ctx.createRadialGradient(w*0.12,h*0.16,4,w*0.12,h*0.16,44);
    sunG.addColorStop(0,"#ffe08a"); sunG.addColorStop(1,"rgba(255,224,138,0)");
    ctx.fillStyle = sunG; ctx.fill();

    // mountain
    ctx.fillStyle = dark ? "#1c3b52" : "#8fa9c4";
    ctx.beginPath();
    ctx.moveTo(w*0.55, h*0.72);
    ctx.lineTo(w*0.72, h*0.28);
    ctx.lineTo(w*0.90, h*0.72);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = dark ? "#dfeaf5" : "#ffffff";
    ctx.beginPath();
    ctx.moveTo(w*0.72, h*0.28);
    ctx.lineTo(w*0.775, h*0.40);
    ctx.lineTo(w*0.665, h*0.40);
    ctx.closePath(); ctx.fill();

    // ocean
    const og = ctx.createLinearGradient(0,h*0.72,0,h);
    og.addColorStop(0, dark ? "#0d3a5c" : "#7fb0dd");
    og.addColorStop(1, dark ? "#061a2c" : "#5a90c4");
    ctx.fillStyle = og; ctx.fillRect(0, h*0.72, w, h*0.28);
    ctx.strokeStyle = dark ? "rgba(140,200,255,.35)" : "rgba(20,60,110,.35)";
    ctx.beginPath(); ctx.moveTo(0, h*0.72); ctx.lineTo(w, h*0.72); ctx.stroke();

    // clouds
    const cShift = Math.sin(t*0.006)*14;
    function cloud(x, y, s){
      ctx.fillStyle = dark ? "rgba(210,228,248,.55)" : "rgba(255,255,255,.92)";
      ctx.beginPath();
      ctx.arc(x, y, 20*s, 0, Math.PI*2);
      ctx.arc(x+22*s, y-7*s, 25*s, 0, Math.PI*2);
      ctx.arc(x+48*s, y, 19*s, 0, Math.PI*2);
      ctx.fill();
    }
    cloud(w*0.24 + cShift, h*0.22, 1);
    cloud(w*0.60 + cShift, h*0.14, 0.85);

    // particles
    parts.forEach(p => {
      const phase = (t*0.0035*p.s + p.p) % 1;
      let x, y;
      if (phase < 0.42){          // evaporation
        const k = phase/0.42;
        x = w*0.30 + Math.sin(phase*10)*8;
        y = h*0.72 - k*(h*0.50);
      } else if (phase < 0.72){   // transport (cloud drift)
        const k = (phase-0.42)/0.30;
        x = w*0.30 + k*(w*0.42);
        y = h*0.22 + Math.sin(k*6)*6;
      } else {                     // precipitation
        const k = (phase-0.72)/0.28;
        x = w*0.72 + Math.sin(k*3)*10;
        y = h*0.24 + k*(h*0.48);
      }
      ctx.fillStyle = phase < 0.72
        ? (dark ? "rgba(120,200,255,.85)" : "rgba(40,110,190,.75)")
        : (dark ? "rgba(160,220,255,.9)"  : "rgba(30,90,170,.85)");
      ctx.beginPath(); ctx.arc(x, y, 2 + p.s*1.6, 0, Math.PI*2); ctx.fill();
    });

    // labels
    ctx.font = "600 11.5px ui-sans-serif, system-ui";
    ctx.fillStyle = dark ? "#cfe0f5" : "#123048";
    ctx.textAlign = "left";
    ctx.fillText("Evaporation / transpiration", w*0.04, h*0.62);
    ctx.fillText("Condensation", w*0.30, h*0.42);
    ctx.fillText("Precipitation", w*0.60, h*0.10);
    ctx.fillText("Runoff → collection", w*0.04, h*0.94);

    vizLoop(draw);
  }
  return { start(){ vizLoop(draw); }, stop(){ stopViz(); } };
}

function catCard(c){
  const total = TOPICS.filter(t => t.cat === c.id).length;

  const pct = total ? Math.round(done/total*100) : 0;
  return `<article class="card hoverable" data-nav="category" data-param="${c.id}" tabindex="0" style="cursor:pointer">
    <div style="font-size:24px">${c.icon}</div>
    <h3 style="margin-top:10px">${esc(c.name)}</h3>
    <p style="margin-top:6px">${esc(c.blurb)}</p>
    <div class="row" style="margin-top:14px;gap:10px">
      <div class="bar" style="flex:1"><i style="width:${pct}%"></i></div>
      <span class="tiny muted">${done}/${total}</span>
    </div>
  </article>`;
}

function relatedBlock(ids){

  }).join("");

  return `

  </div>

  <section class="card">
    <div class="tl-track" id="tlTrack">${segs}</div>

    <div class="tl-marks">
      <span>4.6 Ga</span><span>3.5 Ga</span><span>2.5 Ga</span><span>1.0 Ga</span><span>541 Ma</span><span>252 Ma</span><span>66 Ma</span><span>Today</span>

      <div class="grid" style="gap:7px">
        ${PERIODS.map(p => `
          <button class="row" style="gap:12px;width:100%;text-align:left;padding:9px 11px;border-radius:11px;border:1px solid var(--border);background:var(--panel);cursor:pointer" data-period="${p.name}">
            <span style="width:9px;height:9px;border-radius:99px;background:${p.color};flex:none"></span>
            <span style="flex:1;font-size:13px;font-weight:600">${esc(p.name)}</span>
            <span class="tiny muted">${p.from}–${p.to} Ma</span>
          </button>`).join("")}

  `;
}
function renderEraPanel(ma){
  const era = TIMELINE.find(p => ma <= p.from && ma >= p.to) || TIMELINE[TIMELINE.length-1];

  panel.innerHTML = `
    <div class="row" style="gap:10px;align-items:center">
      <span style="width:12px;height:12px;border-radius:99px;background:${era.color}"></span>

    <p class="small" style="margin-top:8px">Country statistics change over time. Population figures here are approximate ${c.popYear} estimates; area figures are approximate and depend on measurement method (especially for countries with disputed or undefined boundaries). For authoritative and current figures, consult the United Nations Statistics Division and the World Bank Open Data.</p>
    <div class="row wrap" style="margin-top:12px">
      <button class="btn sm" data-nav="topic" data-param="borders">Political geography</button>
      <button class="btn sm" data-nav="topic" data-param="population">Population &amp; density</button>
    </div>
  </section>

  ${refsBlock(["unPop","worldBank","britannica"])}
  `;
}

/* ---------------- SEARCH ---------------- */
function searchAll(q){
  const term = q.trim().toLowerCase();
  if (!term) return { topics:[], countries:[], periods:[] };
  const topics = TOPICS.filter(t =>
    t.title.toLowerCase().includes(term) || t.summary.toLowerCase().includes(term) ||
    t.s.some(([,p]) => p.toLowerCase().includes(term)) || catById(t.cat).name.toLowerCase().includes(term));
  const countries = COUNTRIES.filter(c =>
    c.n.toLowerCase().includes(term) || c.cap.toLowerCase().includes(term) ||
    c.cont.toLowerCase().includes(term) || c.reg.toLowerCase().includes(term));
  const periods = TIMELINE.filter(p => p.name.toLowerCase().includes(term) || p.events.toLowerCase().includes(term))
    .concat(PERIODS.filter(p => p.name.toLowerCase().includes(term)))
    .slice(0,6);

  // "why..." style natural-language mapping
  if (topics.length === 0){
    const map = { earthquake:"earthquakes", volcano:"volcanoes", mountain:"mountains", river:"rivers",
      ocean:"oceans", climate:"climate-zones", rain:"water-cycle", monsoon:"monsoons",
      glacier:"glaciers", desert:"deserts", tsunami:"tsunamis", plate:"plate-tectonics", border:"borders" };
    for (const k in map){
      if (term.includes(k)){ const t = topicById(map[k]); if (t) topics.push(t); }
    }
  }
  return { topics, countries, periods };
}
function viewSearch(q){
  const r = searchAll(q);
  const total = r.topics.length + r.countries.length + r.periods.length;
  return `
  <div class="crumbs"><button data-nav="home">Home</button> › <span>Search</span></div>
  <div class="section-head" style="margin-top:0">
    <div><div class="eyebrow">Results for</div><h2>“${esc(q)}”</h2></div>
    <p>${total} result${total === 1 ? "" : "s"}</p>
  </div>

  ${total === 0 ? `<div class="empty">No results found for “${esc(q)}”. Try a country name, a landform, a process or a geological period.</div>` : ""}

  ${r.countries.length ? `
  <div class="eyebrow">Countries</div>
  <div class="grid" style="gap:9px;margin-bottom:22px">
    ${r.countries.map(c => `<div class="search-result" data-nav="country" data-param="${esc(c.n)}" tabindex="0">
      <span class="r-ic">${c.f}</span>
      <div><h3 style="font-size:14px">${esc(c.n)}</h3><p class="tiny muted">${esc(c.cap)} · ${esc(c.reg)}</p></div>
    </div>`).join("")}
  </div>` : ""}

  ${r.topics.length ? `
  <div class="eyebrow">Topics</div>
  <div class="grid g3" style="margin-bottom:22px">${r.topics.map(topicCard).join("")}</div>` : ""}

  ${r.periods.length ? `
  <div class="eyebrow">Geological time</div>
  <div class="grid" style="gap:9px">
    ${r.periods.map(p => `<div class="search-result" data-nav="timeline" tabindex="0">
      <span class="r-ic">⏳</span>
      <div><h3 style="font-size:14px">${esc(p.name)}</h3>
      <p class="tiny muted">${p.from != null ? `${maToLabel(p.from)} – ${maToLabel(p.to)}` : ""} ${esc(p.note || p.events || "")}</p></div>
    </div>`).join("")}
  </div>` : ""}
  `;
}

/* ---------------- QUIZZES ---------------- */
let quizState = { i:0, score:0, answered:false };
function viewQuizzes(){
  quizState = { i:0, score:0, answered:false };
  return `
  <div class="crumbs"><button data-nav="home">Home</button> › <span>Quizzes</span></div>
  <div class="section-head" style="margin-top:0">
    <div><div class="eyebrow">Interactive learning</div><h2>Test Your Knowledge</h2></div>
    <p>${QUIZZES.length} questions · best score: ${store.data.quizBest}/${QUIZZES.length}</p>
  </div>
  <div id="quizBox"></div>
  `;
}
function renderQuiz(){
  const box = $("#quizBox"); if (!box) return;
  const q = QUIZZES[quizState.i];
  if (!q){
    const pct = Math.round(quizState.score / QUIZZES.length * 100);
    if (quizState.score > store.data.quizBest){ store.data.quizBest = quizState.score; store.save(); }
    box.innerHTML = `<section class="card" style="text-align:center;padding:44px">
      <div style="font-size:44px">${pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "📚"}</div>
      <h2 style="margin-top:12px;font-size:24px;font-weight:770">${quizState.score} / ${QUIZZES.length}</h2>
      <p class="muted" style="margin-top:6px">${pct}% correct</p>
      <div class="row" style="justify-content:center;margin-top:20px">
        <button class="btn primary" id="quizRestart">Try again</button>
        <button class="btn" data-nav="progress">View progress</button>
      </div>
    </section>`;
    $("#quizRestart").addEventListener("click", () => { quizState = { i:0, score:0, answered:false }; renderQuiz(); });
    return;
  }
  box.innerHTML = `
    <section class="card">
      <div class="row" style="justify-content:space-between">
        <span class="chip">Question ${quizState.i+1} of ${QUIZZES.length}</span>
        <span class="chip accent">Score ${quizState.score}</span>
      </div>
      <div class="bar" style="margin:14px 0 20px"><i style="width:${(quizState.i/QUIZZES.length)*100}%"></i></div>
      <h3 style="font-size:17px;font-weight:700;line-height:1.45">${esc(q.q)}</h3>
      <div style="margin-top:18px" id="quizOpts">
        ${q.o.map((o,i) => `<button class="quiz-opt" data-opt="${i}">${esc(o)}</button>`).join("")}
      </div>
      <div id="quizFeedback" style="margin-top:14px"></div>
    </section>`;
  $("#quizOpts").addEventListener("click", e => {
    const b = e.target.closest("[data-opt]"); if (!b || quizState.answered) return;
    quizState.answered = true;
    const chosen = +b.dataset.opt;
    const correct = chosen === q.a;
    if (correct) quizState.score++;
    $$("#quizOpts .quiz-opt").forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.a) btn.classList.add("correct");
      else if (i === chosen) btn.classList.add("wrong");
    });
    const t = topicById(q.topic);
    $("#quizFeedback").innerHTML = `
      <div class="card" style="background:var(--panel-2);padding:14px">
        <strong style="font-size:13.5px">${correct ? "✓ Correct" : "✕ Not quite"}</strong>
        <p class="small" style="margin-top:6px">${esc(q.ex)}</p>
        <div class="row wrap" style="margin-top:12px">
          ${t ? `<button class="btn sm" data-nav="topic" data-param="${t.id}">Review: ${esc(t.title)}</button>` : ""}
          <button class="btn sm primary" id="quizNext">${quizState.i === QUIZZES.length-1 ? "See results" : "Next question →"}</button>
        </div>
      </div>`;
    $("#quizNext").addEventListener("click", () => {
      quizState.i++; quizState.answered = false; renderQuiz();
    });
  });
}

/* ---------------- BOOKMARKS ---------------- */

  <div class="crumbs"><button data-nav="home">Home</button> › <span>Bookmarks</span></div>

/* ---------------- PROGRESS ---------------- */

  const totalTopics = TOPICS.length;
  const doneCount = Object.keys(store.data.completed).length;
  const overall = totalTopics ? Math.round(doneCount/totalTopics*100) : 0;
  const recent = store.data.recent.map(topicById).filter(Boolean).slice(0,5);

  return `
  <div class="crumbs"><button data-nav="home">Home</button> › <span>Progress</span></div>
  <div class="section-head" style="margin-top:0">
    <div><div class="eyebrow">Learning dashboard</div><h2>Your Geography Progress</h2></div>
    <p>${doneCount} of ${totalTopics} topics completed · ${overall}% overall</p>
  </div>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h3 style="font-size:15px">Overall completion</h3>
      <span class="chip accent">${overall}%</span>
    </div>
    <div class="bar" style="height:10px"><i style="width:${overall}%"></i></div>
  </section>

  <div class="grid g2" style="margin-top:18px">
    <section class="card">
      <h3 style="font-size:15.5px;margin-bottom:14px">By subject area</h3>
      <div class="grid" style="gap:14px">
        ${CATEGORIES.map(c => {
          const list = TOPICS.filter(t => t.cat === c.id);
          const done = list.filter(t => store.data.completed[t.id]).length;
          const pct = list.length ? Math.round(done/list.length*100) : 0;
          return `<div>
            <div class="row" style="justify-content:space-between;margin-bottom:6px">
              <span style="font-size:13px">${c.icon} ${esc(c.name)}</span>
              <span class="tiny muted">${pct}%</span>
            </div>
            <div class="bar"><i style="width:${pct}%"></i></div>
          </div>`;
        }).join("")}
      </div>
    </section>

    <div>
      <section class="card">
        <h3 style="font-size:15.5px">Quiz performance</h3>
        <p class="small muted" style="margin-top:6px">Best score: <strong>${store.data.quizBest} / ${QUIZZES.length}</strong></p>
        <div class="bar" style="margin-top:12px"><i style="width:${Math.round(store.data.quizBest/QUIZZES.length*100)}%"></i></div>
        <button class="btn sm primary" style="margin-top:14px" data-nav="quizzes">Take a quiz</button>
      </section>

      <section class="card" style="margin-top:14px">
        <h3 style="font-size:15.5px">Recently explored</h3>
        ${recent.length ? `<div class="grid" style="gap:8px;margin-top:12px">
          ${recent.map(t => `<button class="row" style="gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:11px;border:1px solid var(--border);background:var(--panel);cursor:pointer" data-nav="topic" data-param="${t.id}">
            <span>${t.icon}</span><span style="font-size:13px;flex:1">${esc(t.title)}</span>
            ${store.data.completed[t.id] ? '<span class="chip green tiny">✓</span>' : ""}
          </button>`).join("")}
        </div>` : `<p class="small muted" style="margin-top:8px">Nothing yet — start exploring a topic.</p>`}
      </section>
    </div>
  </div>
  `;
}

/* ==========================================================================
   13. ROUTER
   ========================================================================== */
let currentRoute = { name:"home", param:null };

function navigate(name, param){
  currentRoute = { name, param };
  render();
  window.scrollTo({ top:0, behavior: reduced ? "auto" : "smooth" });
  $("#view").focus({ preventScroll:true });
}

function render(){
  stopViz();
  Globe.unmount();
  const v = $("#view");
  const { name, param } = currentRoute;

  let html = "";
  switch(name){
    case "home":      html = viewHome(); break;
    case "learn":     html = viewLearn(); break;
    case "category":  html = viewCategory(param); break;
    case "topic":     html = viewTopic(param); break;
    case "explore":   html = viewExplore(); break;
    case "timeline":  html = viewTimeline(); break;
    case "countries": html = viewCountries(); break;
    case "country":   html = viewCountry(param); break;
    case "search":    html = viewSearch(param || ""); break;
    case "quizzes":   html = viewQuizzes(); break;
    case "bookmarks": html = viewBookmarks(); break;
    case "progress":  html = viewProgress(); break;
    default:          html = viewHome();
  }
  v.innerHTML = html;
  renderNav(name);

  /* ---- view-specific wiring ---- */
  if (name === "home"){
    const el = $('[data-globe="home"]');
    if (el) Globe.mount(el, { onSelect: handleGlobeSelect });
    const cs = $("#homeCountrySearch");
    if (cs) cs.addEventListener("keydown", e => {
      if (e.key === "Enter" && cs.value.trim()){
        const c = countryByName(cs.value.trim());
        if (c) navigate("country", c.n); else navigate("search", cs.value.trim());
      }
    });
    buildMiniTimeline();
  }

  if (name === "explore"){
    const el = $('[data-globe="explore"]');
    if (el) Globe.mount(el, { onSelect: handleGlobeSelect });
    $("#layerbar").addEventListener("click", e => {
      const b = e.target.closest("[data-layer]"); if (!b) return;
      $$("#layerbar .layerbtn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      Globe.setLayer(b.dataset.layer);
      const info = $("#globeInfo");
      info.innerHTML = `<h4>${esc(b.textContent)} layer</h4><p>${layerDescription(b.dataset.layer)}</p>`;
    });
  }

  if (name === "timeline"){
    const slider = $("#tlSlider");
    const update = () => { renderEraPanel(+slider.value); };
    slider.addEventListener("input", update);
    update();
    $("#tlTrack").addEventListener("click", e => {
      const seg = e.target.closest("[data-era]"); if (!seg) return;
      const era = TIMELINE.find(x => x.id === seg.dataset.era);
      if (era){ slider.value = Math.round((era.from + era.to)/2); update(); }
    });
    $$("[data-period]").forEach(b => b.addEventListener("click", () => {
      const p = PERIODS.find(x => x.name === b.dataset.period);
      const d = $("#periodDetail");
      if (!p) return;
      d.innerHTML = `<div class="card" style="background:var(--panel-2);padding:14px">
        <div class="row" style="gap:9px"><span style="width:10px;height:10px;border-radius:99px;background:${p.color}"></span>
        <strong style="font-size:14px">${esc(p.name)}</strong>
        <span class="chip tiny">${esc(p.era)}</span></div>
        <p class="small muted" style="margin-top:8px">${p.from}–${p.to} Ma (approximately ${((p.from-p.to)).toFixed(0)} million years)</p>
        <p class="small" style="margin-top:8px">${esc(p.note)}</p>
      </div>`;
    }));
  }

  if (name === "countries"){
    const filter = $("#countryFilter");
    const grid = $("#countryGrid");
    const apply = (term, cont) => {
      const t = (term || "").toLowerCase();
      grid.innerHTML = COUNTRIES.filter(c =>
        (!t || c.n.toLowerCase().includes(t) || c.cap.toLowerCase().includes(t) || c.cont.toLowerCase().includes(t)) &&
        (!cont || c.cont === cont)
      ).map(c => `
        <article class="card hoverable" data-nav="country" data-param="${esc(c.n)}" tabindex="0" style="cursor:pointer">
          <div class="row" style="gap:12px">
            <span class="flagbig" style="font-size:30px">${c.f}</span>
            <div><h3>${esc(c.n)}</h3><p class="tiny muted">${esc(c.cap)} · ${esc(c.cont)}</p></div>
          </div>
          <div class="row" style="margin-top:14px;gap:16px">
            <div><div class="tiny muted">Population</div><b style="font-size:13.5px">${(c.pop/1e6).toFixed(1)} M</b></div>
            <div><div class="tiny muted">Area</div><b style="font-size:13.5px">${nf(c.area)} km²</b></div>
          </div>
        </article>`).join("") || `<div class="empty" style="grid-column:1/-1">No countries match that filter.</div>`;
    };
    let cont = null;
    filter.addEventListener("input", () => apply(filter.value, cont));
    $$("[data-cont]").forEach(b => b.addEventListener("click", () => {
      const val = b.dataset.cont;
      cont = (cont === val) ? null : val;
      $$("[data-cont]").forEach(x => x.classList.toggle("accent", x.dataset.cont === cont));
      apply(filter.value, cont);
    }));
  }

  if (name === "country"){
    const btn = $("#showOnGlobe");
    const c = countryByName(param);
    if (btn && c) btn.addEventListener("click", () => {
      Globe.setLayer("political");
      navigate("explore");
      setTimeout(() => Globe.focus(c.lat, c.lon), 80);
      toast(`Focused on ${c.n}`);
    });
  }

  if (name === "quizzes") renderQuiz();

  if (name === "topic"){
    const t = topicById(param);
    if (t){
      $("#completeBtn").addEventListener("click", () => {
        const now = !store.data.completed[t.id];
        markComplete(t.id, now);
        toast(now ? "Marked as completed ✓" : "Marked as not completed");
        render();
      });
      $("#bookmarkBtn").addEventListener("click", () => {
        const on = toggleBookmark(t.id);
        toast(on ? "Bookmarked 🔖" : "Bookmark removed");
        render();
      });
      if (t.viz === "tectonics"){
        const cv = $("#topicViz");
        const viz = TectonicsViz(cv);
        viz.start();
        $("#tectCtrls").addEventListener("click", e => {
          const b = e.target.closest("[data-mode]"); if (!b) return;
          $$("#tectCtrls button").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          viz.setMode(b.dataset.mode);
        });
      } else if (t.viz === "watercycle"){
        const viz = WaterCycleViz($("#topicViz"));
        viz.start();
      }
    }
  }
}

function layerDescription(id){
  return {
    political:"Country markers. Selecting one opens its full profile. In production this layer would render authoritative boundary polygons from a GeoJSON/tile source.",
    physical:"Major mountain ranges, deserts, river basins and reefs — the large-scale features of the natural landscape.",
    geological:"Indicative tectonic plate boundaries, ridges and volcanic provinces. Lines are simplified for illustration.",
    climate:"Representative locations of Köppen climate zones. Real climate regions are irregular and are shown here only as guide points.",
    population:"Countries sized by approximate population. Larger marker = larger population.",
    disasters:"Indicative hazard belts — seismic zones, hurricane tracks and tornado regions."
  }[id] || "";
}

function handleGlobeSelect(data){
  const info = $("#globeInfo");
  if (data.nav === "country"){ navigate("country", data.param); return; }
  if (data.nav === "topic"){ navigate("topic", data.param); return; }
  if (data.nav === "search"){ navigate("search", data.param); return; }
  if (info){
    info.innerHTML = `<h4>${esc(data.title || "Location")}</h4><p>${esc(data.sub || "")}</p>`;
  }
}

/* ---------- Mini timeline on the homepage ---------- */
function buildMiniTimeline(){
  const host = $("#miniTimeline");
  if (!host) return;
  const total = 4600;
  host.innerHTML = `
    <div style="padding:18px">
      <div class="tl-track" style="height:46px">
        ${TIMELINE.map(p => {
          const w = (p.from - p.to)/total*100;
          return `<div class="tl-seg" style="flex:0 0 ${w}%;background:${p.color}" data-mini="${p.id}">${w>7?esc(p.name):""}</div>`;
        }).join("")}
      </div>
      <div id="miniInfo" style="margin-top:16px"></div>
    </div>`;
  const info = $("#miniInfo");
  const show = id => {
    const p = TIMELINE.find(x => x.id === id);
    if (!p) return;
    info.innerHTML = `
      <div class="row wrap" style="gap:10px">
        <span class="chip accent">${maToLabel(p.from)} – ${maToLabel(p.to)}</span>
        <span class="chip">${esc(p.eon)}</span>
      </div>
      <h3 style="font-size:18px;font-weight:750;margin-top:10px">${esc(p.name)}</h3>
      <p class="small muted" style="margin-top:6px"><strong>Continents:</strong> ${esc(p.continents)}</p>
      <p class="small muted" style="margin-top:4px"><strong>Life:</strong> ${esc(p.life)}</p>
      <div class="row wrap" style="margin-top:12px">
        <button class="btn sm" data-nav="timeline">Open full timeline</button>
      </div>`;
  };
  host.addEventListener("click", e => {
    const seg = e.target.closest("[data-mini]");
    if (seg) show(seg.dataset.mini);
  });
  show("hadean");
}

/* ==========================================================================
   14. GLOBAL EVENT DELEGATION
   ========================================================================== */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav){ e.preventDefault(); navigate(nav.dataset.nav, nav.dataset.param); return; }
  const bm = e.target.closest("[data-bookmark-toggle]");
  if (bm){ e.preventDefault(); toggleBookmark(bm.dataset.bookmarkToggle); toast("Bookmark updated"); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("[data-nav][tabindex]")) e.target.click();
  if (e.key === "/" && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); $("#globalSearch").focus(); }
});

/* ---------- Global search ---------- */
let searchTimer;
$("#globalSearch").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => {
    if (v.trim().length >= 2) navigate("search", v.trim());
    else if (currentRoute.name === "search") navigate("home");
  }, 320);
});

/* ---------- Theme ---------- */
function applyTheme(theme){
  document.documentElement.dataset.theme = theme;
  store.data.theme = theme; store.save();
  $("#themeToggle").textContent = theme === "dark" ? "🌙" : "☀️";
  Globe.setTheme(theme);
}
$("#themeToggle").addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

/* ==========================================================================
   15. INIT
   ========================================================================== */
applyTheme(store.data.theme || "dark");
navigate("home");
</script>
